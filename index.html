<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern – Contractor Search</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--acc:#1e3a5f;--acc2:#2f6fb0;--chip:#e8eef6;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#171e28;--ink:#e5e9f0;--mut:#93a0b3;--line:#263041;--acc:#8fb8ea;--acc2:#6aa3e0;--chip:#1f2a3a;--warn:#f0b35a}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#171e28;--ink:#e5e9f0;--mut:#93a0b3;--line:#263041;--acc:#8fb8ea;--acc2:#6aa3e0;--chip:#1f2a3a;--warn:#f0b35a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Calibri,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
h1{font:700 28px/1.2 Cambria,Georgia,serif;color:var(--acc);margin:0}
.sub{color:var(--mut);margin:4px 0 18px}
.sw{position:relative}
#q{width:100%;padding:14px 16px;font-size:17px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--acc2)}
#sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#sug div{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#sug div:hover,#sug div.on{background:var(--chip)}
#sug small{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{background:var(--chip);color:var(--acc);border:0;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.stats{color:var(--mut);font-size:13px;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}
.card h2{margin:0 0 4px;font-size:22px;color:var(--acc)}
.var{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;color:var(--ink)}.kpi span{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--acc2)}
.bar span:first-child{width:190px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f{border-top:1px solid var(--line);padding:12px 0}
.f:first-of-type{border-top:0}
.tag{display:inline-block;background:var(--chip);color:var(--acc);border-radius:6px;padding:1px 8px;font-size:12px;margin-right:6px}
.cite{color:var(--mut);font-size:13px}
.amt{font-weight:700}
details summary{cursor:pointer;color:var(--acc2);font-size:13px;margin-top:4px}
details p{font-size:13px;color:var(--mut);margin:6px 0 0;white-space:pre-wrap}
.note{font-size:12px;color:var(--warn);margin-top:14px}
.empty{color:var(--mut);margin-top:26px}
.scroll{overflow-x:auto}

.lm textarea{width:100%;min-height:140px;padding:12px 14px;font:14px/1.5 system-ui,sans-serif;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical}
.lm button{margin-top:10px;background:var(--acc2);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer}
.lm button:disabled{opacity:.6;cursor:wait}
.lm table{border-collapse:collapse;width:100%;margin-top:12px;font-size:14px}
.lm td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}.lm td:first-child{color:var(--mut);width:38%}
</style></head><body><div class="wrap">
<h1>Pattern</h1>
<p class="sub">Type a contractor or company name to see every audit paragraph it appears in.</p>
<div class="sw"><input id="q" placeholder="e.g. WAPCOS, Mastek, Reliance…" autocomplete="off"><div id="sug"></div></div>
<div class="chips" id="chips"></div>
<div class="stats" id="stats"></div>
<div id="out"><p class="empty">Search above, or tap a name that appears in more than one paragraph.</p></div>
<div class="card lm"><h2>Try the extraction model</h2>
<div class="var">Paste an audit paragraph. The fine-tuned LoRA model returns contractor, finding type, amount, state and more.</div>
<textarea id="lm_in" placeholder="Paste a CAG audit paragraph here..."></textarea>
<button id="lm_btn">Extract</button><div id="lm_out"></div></div>
</div>

const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const E=DATA.entities;
$("stats").textContent=`${DATA.n_paras} audit paragraphs · ${E.length} distinct names · states: ${DATA.states.join(", ")}`;
const multi=E.filter(e=>e.findings.length>1).sort((a,b)=>b.findings.length-a.findings.length);
$("chips").innerHTML=multi.map(e=>`<button class="chip" data-k="${esc(e.key)}">${esc(e.name)} · ${e.findings.length}</button>`).join("");
function search(t){
  const q=norm(t); if(!q) return [];
  const toks=q.split(" ");
  return E.map(e=>{
    const hay=[e.key,...e.variants.map(norm)].join(" | ");
    let s=0; if(hay.includes(q)) s=2; else if(toks.every(w=>hay.includes(w))) s=1;
    return {e,s};
  }).filter(x=>x.s).sort((a,b)=>b.s-a.s||b.e.findings.length-a.e.findings.length).map(x=>x.e);
}
function show(list){
  if(!list.length){$("out").innerHTML='<p class="empty">No match in the current dataset. Try a shorter name.</p>';return;}
  $("out").innerHTML=list.slice(0,5).map(card).join("");
}
function card(e){
  const fs=e.findings, tot=fs.reduce((a,f)=>a+(f.amount||0),0);
  const states=[...new Set(fs.map(f=>f.state).filter(Boolean))];
  const yrs=fs.map(f=>f.year).filter(Boolean); const yr=yrs.length?(Math.min(...yrs)===Math.max(...yrs)?Math.min(...yrs):Math.min(...yrs)+"–"+Math.max(...yrs)):"n/a";
  const types={}; fs.forEach(f=>{const t=f.type||"unclassified";types[t]=(types[t]||0)+1});
  const tmax=Math.max(...Object.values(types));
  const bars=Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<div class="bar"><span title="${esc(t)}">${esc(t)}</span><i style="width:${Math.max(6,n/tmax*140)}px"></i><span>${n}</span></div>`).join("");
  const vars=e.variants.length>1?`<div class="var">Appears as: ${e.variants.map(esc).join(" · ")}</div>`:"";
  const items=fs.map(f=>`<div class="f"><div><span class="tag">${esc(f.type||"unclassified")}</span><span class="amt">${f.amount!=null?"₹"+f.amount+" cr":"amount n/a"}</span></div>
   <div>${esc(f.dept)}${f.scheme?" · "+esc(f.scheme):""}</div>
   <div class="cite">${esc(f.state)}${f.year?" · "+f.year:""} · ${esc(f.pid)} · ${esc(f.cite)}${f.desig?" · "+esc(f.desig):""}</div>
   <details><summary>Show paragraph excerpt</summary><p>${esc(f.text)}</p></details></div>`).join("");
  return `<div class="card"><h2>${esc(e.name)}</h2>${vars}
   <div class="grid"><div class="kpi"><b>${fs.length}</b><span>audit paragraphs</span></div>
   <div class="kpi"><b>${tot?("₹"+tot.toFixed(2)):"n/a"}</b><span>crore in those paragraphs</span></div>
   <div class="kpi"><b>${states.length}</b><span>${esc(states.join(", ")||"state n/a")}</span></div>
   <div class="kpi"><b>${yr}</b><span>year(s)</span></div></div>
   <div>${bars}</div><h3 style="margin:16px 0 0;font-size:15px">Findings &amp; citations</h3><div class="scroll">${items}</div>
   <div class="note">Amounts are the figure for the whole cited paragraph, which can name several parties, so do not read them as this party's own liability.</div></div>`;
}
const sug=$("sug");
$("q").addEventListener("input",ev=>{
  const r=search(ev.target.value).slice(0,6);
  sug.innerHTML=r.map(e=>`<div data-k="${esc(e.key)}">${esc(e.name)}<small>${e.findings.length} paragraph${e.findings.length>1?"s":""}</small></div>`).join("");
  sug.style.display=r.length?"block":"none";
  show(search(ev.target.value)); if(!ev.target.value.trim()) $("out").innerHTML='<p class="empty">Search above, or tap a name that appears in more than one paragraph.</p>';
});
$("q").addEventListener("keydown",ev=>{if(ev.key==="Enter")sug.style.display="none"});
function pick(k){const e=E.find(x=>x.key===k); if(!e)return; $("q").value=e.name; sug.style.display="none"; show([e]);}
sug.addEventListener("click",ev=>{const d=ev.target.closest("[data-k]"); if(d)pick(d.dataset.k)});
$("chips").addEventListener("click",ev=>{const d=ev.target.closest("[data-k]"); if(d)pick(d.dataset.k)});
document.addEventListener("click",ev=>{if(!ev.target.closest(".sw"))sug.style.display="none"});

/* ---- LoRA model connection ---- */
const API_URL="https://prissy-corner-evidence.ngrok-free.dev"; // e.g. https://xxxx.ngrok-free.app
$("lm_btn").addEventListener("click",async()=>{
  const text=$("lm_in").value.trim(), out=$("lm_out"), btn=$("lm_btn");
  if(!text){out.innerHTML='<p class="empty">Paste a paragraph first.</p>';return;}
  btn.disabled=true; btn.textContent="Running model..."; out.innerHTML="";
  try{
    const r=await fetch(API_URL.replace(/\/$/,"")+"/extract",{method:"POST",
      headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"true"},
      body:JSON.stringify({text})});
    if(!r.ok) throw new Error("Server returned "+r.status);
    const d=await r.json(), res=d.result;
    if(!res){out.innerHTML='<p class="empty">Model output could not be parsed as JSON:</p><details open><summary>Raw output</summary><p>'+esc(d.raw)+'</p></details>';return;}
    const rows=Object.entries(res).map(([k,v])=>"<tr><td>"+esc(k.replace(/_/g," "))+"</td><td>"+esc(Array.isArray(v)?v.join(", "):(v??"-"))+"</td></tr>").join("");
    out.innerHTML="<table>"+rows+"</table>";
  }catch(e){
    out.innerHTML='<p class="empty">Could not reach the model ('+esc(e.message)+'). Is the Colab session running and API_URL up to date?</p>';
  }finally{btn.disabled=false; btn.textContent="Extract";}
});
